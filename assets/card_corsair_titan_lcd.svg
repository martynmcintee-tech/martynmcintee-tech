<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="corsair-titan-lcd-linux repository card">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="url(#cardBg2)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="24" y="1" width="180" height="2.5" rx="1.25" fill="url(#topBar2)"/>

  <!-- Icon + Repo Title -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- Circular LCD + tiny C64 roof icon -->
    <circle cx="17" cy="17" r="11.5" fill="#090D16" stroke="#F59E0B" stroke-width="1.4"/>
    <polygon points="11,17 17,11 23,17" fill="#B84A39"/>
    <rect x="13" y="17" width="8" height="6" fill="#D2B48C"/>

    <text x="46" y="16" fill="#94A3B8" font-size="11.5" class="mono">martynmcintee-tech /</text>
    <text x="46" y="34" fill="#F8FAFC" font-size="19" font-weight="700" class="sans">corsair-titan-lcd-linux</text>

    <rect x="434" y="4" width="98" height="24" rx="12" fill="#1C160C" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1"/>
    <text x="483" y="20" text-anchor="middle" fill="#FBBF24" font-size="10.5" font-weight="600" class="mono">LINUX + C64</text>
  </g>

  <!-- Description -->
  <text x="24" y="88" fill="#CBD5E1" font-size="13.5" class="sans">13-theme circular 480×480 Linux telemetry engine &amp; autonomous 1985</text>
  <text x="24" y="108" fill="#CBD5E1" font-size="13.5" class="sans">Commodore 64 'Little Computer People' house for Corsair TITAN RX LCDs.</text>

  <!-- Feature Pills -->
  <g transform="translate(24, 128)">
    <rect x="0" y="0" width="166" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="83" y="16" text-anchor="middle" fill="#FCD34D" font-size="10.5" class="mono">~11ms HTTP Keep-Alive</text>

    <rect x="174" y="0" width="168" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="258" y="16" text-anchor="middle" fill="#6EE7B7" font-size="10.5" class="mono">Pepto VIC-II 16-Color</text>

    <rect x="350" y="0" width="182" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="441" y="16" text-anchor="middle" fill="#CBD5E1" font-size="10.5" class="mono">13 Circular HUD Faces</text>
  </g>

  <!-- Footer -->
  <g transform="translate(24, 176)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="18" y="10" fill="#94A3B8" font-size="12" class="sans">Python  ·  OpenLinkHub API  ·  Pillow  ·  systemd</text>
    <text x="532" y="10" text-anchor="end" fill="#FBBF24" font-size="12" font-weight="600" class="mono">Explore →</text>
  </g>
</svg>
