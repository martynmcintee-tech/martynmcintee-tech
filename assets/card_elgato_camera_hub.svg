<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="elgato-camera-hub-linux repository card">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="url(#cardBg3)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="24" y="1" width="180" height="2.5" rx="1.25" fill="url(#topBar3)"/>

  <!-- Icon + Repo Title -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- Camera lens icon -->
    <circle cx="17" cy="17" r="10.5" fill="#090D16" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="4.5" fill="#0EA5E9" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="20" cy="14" r="1.3" fill="#E0F2FE"/>

    <text x="46" y="16" fill="#94A3B8" font-size="11.5" class="mono">martynmcintee-tech /</text>
    <text x="46" y="34" fill="#F8FAFC" font-size="19" font-weight="700" class="sans">elgato-camera-hub-linux</text>

    <rect x="432" y="4" width="100" height="24" rx="12" fill="#0A1929" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1"/>
    <text x="482" y="20" text-anchor="middle" fill="#22D3EE" font-size="10.5" font-weight="600" class="mono">GTK4 + V4L2</text>
  </g>

  <!-- Description -->
  <text x="24" y="88" fill="#CBD5E1" font-size="13.5" class="sans">Native Linux GTK4 + Libadwaita studio controller for Elgato Facecam 4K</text>
  <text x="24" y="108" fill="#CBD5E1" font-size="13.5" class="sans">with live ePTZ, Kelvin WB &amp; manual exposure alongside PipeWire apps.</text>

  <!-- Feature Pills -->
  <g transform="translate(24, 128)">
    <rect x="0" y="0" width="160" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="80" y="16" text-anchor="middle" fill="#67E8F9" font-size="10.5" class="mono">Direct V4L2 ioctl</text>

    <rect x="168" y="0" width="182" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="259" y="16" text-anchor="middle" fill="#93C5FD" font-size="10.5" class="mono">Live Multi-App Control</text>

    <rect x="358" y="0" width="174" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="445" y="16" text-anchor="middle" fill="#CBD5E1" font-size="10.5" class="mono">4K ePTZ &amp; 50Hz UK</text>
  </g>

  <!-- Footer -->
  <g transform="translate(24, 176)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="18" y="10" fill="#94A3B8" font-size="12" class="sans">Python  ·  GTK4 / Libadwaita  ·  PipeWire  ·  GStreamer</text>
    <text x="532" y="10" text-anchor="end" fill="#22D3EE" font-size="12" font-weight="600" class="mono">Explore →</text>
  </g>
