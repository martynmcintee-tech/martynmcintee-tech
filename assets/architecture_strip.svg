<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Systems and Engineering Stack Matrix">
  <defs>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="188" rx="14" fill="url(#stripBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Column Dividers -->
  <line x1="305" y1="24" x2="305" y2="166" stroke="#1E293B" stroke-width="1"/>
  <line x1="605" y1="24" x2="605" y2="166" stroke="#1E293B" stroke-width="1"/>
  <line x1="905" y1="24" x2="905" y2="166" stroke="#1E293B" stroke-width="1"/>

  <!-- Column 1 -->
  <g transform="translate(28, 32)">
    <text x="0" y="12" fill="#38BDF8" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">01 // LOCAL AI &amp; CORTEX</text>
    <text x="0" y="42" fill="#F1F5F9" font-size="13.5" font-weight="600" class="sans">Multi-Model Orchestration</text>
    <text x="0" y="68" fill="#94A3B8" font-size="12.5" class="sans">• llama.cpp Router &amp; GGUF Fleet</text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">• CPU-Pinned BGE-M3 Embeddings</text>
    <text x="0" y="112" fill="#94A3B8" font-size="12.5" class="sans">• Hebbian &amp; Hopfield Memory</text>
    <text x="0" y="134" fill="#94A3B8" font-size="12.5" class="sans">• 4-Bit QLoRA Adapter Forging</text>
  </g>

  <!-- Column 2 -->
  <g transform="translate(330, 32)">
    <text x="0" y="12" fill="#818CF8" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">02 // LINUX &amp; HARDWARE</text>
    <text x="0" y="42" fill="#F1F5F9" font-size="13.5" font-weight="600" class="sans">Deterministic Control</text>
    <text x="0" y="68" fill="#94A3B8" font-size="12.5" class="sans">• Ubuntu 24.04 LTS &amp; systemd</text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">• OpenLinkHub &amp; USB HID Telemetry</text>
    <text x="0" y="112" fill="#94A3B8" font-size="12.5" class="sans">• GTK4 Desktop &amp; Tray Tooling</text>
    <text x="0" y="134" fill="#94A3B8" font-size="12.5" class="sans">• NVMe Direct I/O Optimization</text>
  </g>

  <!-- Column 3 -->
  <g transform="translate(630, 32)">
    <text x="0" y="12" fill="#10B981" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">03 // CORE LANGUAGES</text>
    <text x="0" y="42" fill="#F1F5F9" font-size="13.5" font-weight="600" class="sans">Systems &amp; Full-Stack</text>
    <text x="0" y="68" fill="#94A3B8" font-size="12.5" class="sans">• Python 3 (Asyncio, PySide6, PIL)</text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">• Go &amp; Modern JavaScript / Node</text>
    <text x="0" y="112" fill="#94A3B8" font-size="12.5" class="sans">• SQLite WAL &amp; FTS5 Vector Stores</text>
    <text x="0" y="134" fill="#94A3B8" font-size="12.5" class="sans">• Android / ADB Automation</text>
  </g>

  <!-- Column 4 -->
  <g transform="translate(930, 32)">
    <text x="0" y="12" fill="#F59E0B" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">04 // 3D, XR &amp; SIMULATION</text>
    <text x="0" y="42" fill="#F1F5F9" font-size="13.5" font-weight="600" class="sans">Spatial &amp; Procedural</text>
    <text x="0" y="68" fill="#94A3B8" font-size="12.5" class="sans">• Godot 4 (Vulkan Mobile / OpenXR)</text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">• Blender LTS (OptiX Rendering)</text>
    <text x="0" y="112" fill="#94A3B8" font-size="12.5" class="sans">• Meta Quest 3 Standalone XR</text>
    <text x="0" y="134" fill="#94A3B8" font-size="12.5" class="sans">• Retro State-Machine Engines</text>
  </g>
</svg>
