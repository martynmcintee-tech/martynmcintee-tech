<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="loseit-local repository card">
  <defs>
    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topBar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="url(#cardBg5)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="24" y="1" width="180" height="2.5" rx="1.25" fill="url(#topBar5)"/>

  <!-- Icon + Repo Title -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- Macro ring + trend line icon -->
    <circle cx="17" cy="17" r="10" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="44 18"/>
    <polyline points="11,20 15,16 18,18 23,12" fill="none" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="46" y="16" fill="#94A3B8" font-size="11.5" class="mono">martynmcintee-tech /</text>
    <text x="46" y="34" fill="#F8FAFC" font-size="19" font-weight="700" class="sans">loseit-local</text>

    <rect x="428" y="4" width="104" height="24" rx="12" fill="#0B211D" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <text x="480" y="20" text-anchor="middle" fill="#34D399" font-size="10.5" font-weight="600" class="mono">OFFLINE APP</text>
  </g>

  <!-- Description -->
  <text x="24" y="88" fill="#CBD5E1" font-size="13.5" class="sans">Offline-first dark-theme PySide6 desktop nutrition, macro &amp; weight</text>
  <text x="24" y="108" fill="#CBD5E1" font-size="13.5" class="sans">tracker with idempotent LoseIt! GWT-RPC sync &amp; optional Vision AI.</text>

  <!-- Feature Pills -->
  <g transform="translate(24, 128)">
    <rect x="0" y="0" width="166" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="83" y="16" text-anchor="middle" fill="#6EE7B7" font-size="10.5" class="mono">GWT-RPC Importer</text>

    <rect x="174" y="0" width="174" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="261" y="16" text-anchor="middle" fill="#99F6E4" font-size="10.5" class="mono">st+lbs / kg / lbs</text>

    <rect x="356" y="0" width="176" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="444" y="16" text-anchor="middle" fill="#CBD5E1" font-size="10.5" class="mono">Local Vision AI</text>
  </g>

  <!-- Footer -->
  <g transform="translate(24, 176)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="18" y="10" fill="#94A3B8" font-size="12" class="sans">Python  ·  PySide6 (Qt6)  ·  SQLite  ·  OpenAI-Compatible</text>
    <text x="532" y="10" text-anchor="end" fill="#34D399" font-size="12" font-weight="600" class="mono">Explore →</text>
  </g>
