    <rect x="180" y="0" width="172" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="266" y="16" text-anchor="middle" fill="#93C5FD" font-size="10.5" class="mono">Auto cpufreq Boost</text>

    <rect x="360" y="0" width="172" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="446" y="16" text-anchor="middle" fill="#CBD5E1" font-size="10.5" class="mono">llama.cpp + ComfyUI</text>
