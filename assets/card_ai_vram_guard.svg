<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="linux-ai-vram-guard repository card">
  <defs>
    <linearGradient id="cardBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topBar6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="url(#cardBg6)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="24" y="1" width="180" height="2.5" rx="1.25" fill="url(#topBar6)"/>

  <!-- Icon + Repo Title -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1E293B" stroke="#22C55E" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- GPU Die / Shield Icon -->
    <rect x="9" y="9" width="16" height="16" rx="3" fill="#090D16" stroke="#22C55E" stroke-width="1.5"/>
    <rect x="13" y="13" width="8" height="8" rx="1.5" fill="#22C55E" fill-opacity="0.4" stroke="#86EFAC" stroke-width="1"/>

    <text x="46" y="16" fill="#94A3B8" font-size="11.5" class="mono">martynmcintee-tech /</text>
    <text x="46" y="34" fill="#F8FAFC" font-size="19" font-weight="700" class="sans">linux-ai-vram-guard</text>

    <rect x="426" y="4" width="106" height="24" rx="12" fill="#0C2117" stroke="#22C55E" stroke-opacity="0.45" stroke-width="1"/>
    <text x="479" y="20" text-anchor="middle" fill="#4ADE80" font-size="10.5" font-weight="600" class="mono">CUDA DAEMON</text>
  </g>

  <!-- Description -->
  <text x="24" y="88" fill="#CBD5E1" font-size="13.5" class="sans">Small stdlib Python daemon that bumps CPU governors during AI coding</text>
