<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="Martyn McIntee - Ubuntu Linux tools, local RTX 3090 models, and hardware tinkering">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#09101D"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="82%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="15%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -48; }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.4; }
      }
      .pulse { animation: pulseDot 2.8s ease-in-out infinite; }
      .synapse-flow { stroke-dasharray: 6 6; animation: flowDash 3.6s linear infinite; }
      .node-a { animation: nodeGlow 3.2s ease-in-out infinite; }
      .node-b { animation: nodeGlow 3.2s ease-in-out 1.1s infinite; }
      .node-c { animation: nodeGlow 3.2s ease-in-out 2.2s infinite; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="1198" height="308" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="308" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="308" rx="16" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="1198" height="308" rx="16" fill="url(#glowAmber)"/>

  <!-- Top Accent Hairline -->
  <rect x="48" y="1" width="380" height="2.5" rx="1.25" fill="url(#accentLine)"/>

  <!-- Right-Side Decorative Neural / Telemetry Constellation -->
  <g transform="translate(845, 34)">
    <circle cx="155" cy="116" r="100" fill="#0B1220" fill-opacity="0.65" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="155" cy="116" r="86" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 5"/>
    <circle cx="155" cy="116" r="62" fill="none" stroke="#818CF8" stroke-opacity="0.20" stroke-width="1"/>

    <!-- Synapse edges -->
    <line x1="96" y1="76" x2="155" y2="50" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.2"/>
    <line x1="155" y1="50" x2="214" y2="80" stroke="#818CF8" stroke-opacity="0.42" stroke-width="1.2" class="synapse-flow"/>
    <line x1="96" y1="76" x2="112" y2="146" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.2"/>
    <line x1="96" y1="76" x2="155" y2="116" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4" class="synapse-flow"/>
    <line x1="214" y1="80" x2="155" y2="116" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.4"/>
    <line x1="112" y1="146" x2="155" y2="116" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.3"/>
    <line x1="198" y1="152" x2="155" y2="116" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1.4" class="synapse-flow"/>
    <line x1="112" y1="146" x2="155" y2="182" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="198" y1="152" x2="155" y2="182" stroke="#F59E0B" stroke-opacity="0.40" stroke-width="1.2"/>
    <line x1="214" y1="80" x2="198" y2="152" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Specialist Nodes -->
    <circle cx="155" cy="116" r="9" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="155" cy="116" r="3.8" fill="#E0F2FE" class="node-a"/>

    <circle cx="96" cy="76" r="5.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8" class="node-b"/>
    <circle cx="155" cy="50" r="5.5" fill="#0F172A" stroke="#818CF8" stroke-width="1.8" class="node-c"/>
    <circle cx="214" cy="80" r="5.5" fill="#0F172A" stroke="#818CF8" stroke-width="1.8" class="node-a"/>
    <circle cx="112" cy="146" r="5.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8" class="node-c"/>
    <circle cx="198" cy="152" r="5.5" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8" class="node-b"/>
    <circle cx="155" cy="182" r="5.5" fill="#0F172A" stroke="#10B981" stroke-width="1.8" class="node-a"/>

    <!-- Mini Telemetry Readout under ring -->
    <rect x="53" y="204" width="204" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="155" y="221" text-anchor="middle" fill="#94A3B8" font-size="10.5" letter-spacing="0.7" class="mono">RTX 3090 · UBUNTU 24.04</text>
  </g>

  <!-- Status Pill -->
  <rect x="48" y="38" width="338" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
  <circle cx="66" cy="52" r="4.5" fill="#10B981" class="pulse"/>
  <text x="80" y="56" fill="#CBD5E1" font-size="11.5" font-weight="600" letter-spacing="0.5" class="mono">UNITED KINGDOM · @martynmcintee-tech</text>

  <!-- Main Heading -->
  <text x="48" y="118" fill="#F8FAFC" font-size="44" font-weight="800" letter-spacing="-0.8" class="sans">Martyn McIntee</text>

  <!-- Subtitle -->
  <text x="48" y="154" fill="#38BDF8" font-size="16.5" font-weight="600" letter-spacing="0.3" class="sans">Ubuntu Desktop Tools  ·  Linux Hardware Tinkering  ·  Local LLMs on 24GB VRAM</text>

  <!-- Summary -->
  <text x="48" y="190" fill="#94A3B8" font-size="14.5" class="sans">Moved my main PC from Windows to Ubuntu and started writing the missing Linux apps for my</text>
  <text x="48" y="212" fill="#94A3B8" font-size="14.5" class="sans">desk hardware, plus tools for running local GGUF models on a single 24GB RTX 3090.</text>

  <!-- Bottom Strip -->
  <g transform="translate(48, 244)">
    <rect x="0" y="0" width="244" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="20" fill="#38BDF8" font-size="11.5" font-weight="600" class="mono">GPU:</text>
    <text x="52" y="20" fill="#E2E8F0" font-size="11.5" class="mono">RTX 3090 24GB · GGUF</text>

    <rect x="254" y="0" width="256" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="268" y="20" fill="#818CF8" font-size="11.5" font-weight="600" class="mono">OS:</text>
    <text x="298" y="20" fill="#E2E8F0" font-size="11.5" class="mono">Ubuntu 24.04 · Python · Go</text>

    <rect x="520" y="0" width="268" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="534" y="20" fill="#F59E0B" font-size="11.5" font-weight="600" class="mono">KIT:</text>
    <text x="572" y="20" fill="#E2E8F0" font-size="11.5" class="mono">V4L2 · OpenLinkHub · GTK4</text>
  </g>
</svg>
