<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="openlinkhub-gtk-control-center repository card">
  <defs>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topBar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="url(#cardBg4)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="24" y="1" width="180" height="2.5" rx="1.25" fill="url(#topBar4)"/>

  <!-- Icon + Repo Title -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1E293B" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- RGB Ring + Fan Hub Icon -->
    <circle cx="17" cy="17" r="10.5" fill="none" stroke="#EC4899" stroke-width="1.8" stroke-dasharray="11 5"/>
    <circle cx="17" cy="17" r="7.5" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
    <circle cx="17" cy="17" r="2.8" fill="#F472B6"/>

    <text x="46" y="16" fill="#94A3B8" font-size="11.5" class="mono">martynmcintee-tech /</text>
    <text x="46" y="34" fill="#F8FAFC" font-size="18.2" font-weight="700" class="sans">openlinkhub-gtk-control-center</text>

    <rect x="434" y="4" width="98" height="24" rx="12" fill="#1E1024" stroke="#EC4899" stroke-opacity="0.45" stroke-width="1"/>
    <text x="483" y="20" text-anchor="middle" fill="#F472B6" font-size="10.5" font-weight="600" class="mono">GTK4 + RGB</text>
  </g>

  <!-- Description -->
  <text x="24" y="88" fill="#CBD5E1" font-size="13.5" class="sans">GTK4 desktop and top-bar tray app for Corsair iCUE LINK fans, pump</text>
  <text x="24" y="108" fill="#CBD5E1" font-size="13.5" class="sans">speeds, gamma-2.4 RGB colours, and OpenLinkHub lighting effects.</text>

  <!-- Feature Pills -->
  <g transform="translate(24, 128)">
    <rect x="0" y="0" width="164" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" fill="#F9A8D4" font-size="10.5" class="mono">Gamma 2.4 LED Fix</text>

    <rect x="172" y="0" width="176" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="260" y="16" text-anchor="middle" fill="#DDD6FE" font-size="10.5" class="mono">12 OpenLinkHub FX</text>

    <rect x="356" y="0" width="176" height="24" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="444" y="16" text-anchor="middle" fill="#CBD5E1" font-size="10.5" class="mono">Fan Speeds &amp; Tray</text>
  </g>

  <!-- Footer -->
  <g transform="translate(24, 176)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="18" y="10" fill="#94A3B8" font-size="12" class="sans">Python  ·  GTK4 / Libadwaita  ·  OpenLinkHub  ·  systemd</text>
    <text x="532" y="10" text-anchor="end" fill="#F472B6" font-size="12" font-weight="600" class="mono">Explore →</text>
  </g>
